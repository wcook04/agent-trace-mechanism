name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install '.[mcp,test,build]'
      - run: python -m pytest tests -q
      - run: python tools/demo_codex.py
      - run: python tools/record_native_contract.py --check
      - run: python tools/inspect_recorded_run.py
      - run: python tools/inspect_agent_tree.py
      - run: python tools/inspect_cross_provider.py
      - run: python tools/measure_retrieval.py examples/validation-history.jsonl --repeats 1
      - run: python tools/check_layout.py
      - run: node --test tests/structurer.test.mjs
      - run: python tools/regenerate_examples.py --check
      - run: python tools/check_distribution.py
