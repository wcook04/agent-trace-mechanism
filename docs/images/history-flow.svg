<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 532" role="img" aria-labelledby="history-title history-desc">
  <title id="history-title">From local session files to an agent's context</title>
  <desc id="history-desc">Agent Trace reads the Codex and Claude Code session files you register. An agent in either app sends an MCP request to Agent Trace and receives selected conversation text or supported Codex items with source references. The diagram shows data flow, not a recorded execution.</desc>
  <!--
  Adapted from the node masks, orthogonal connectors, focal-node treatment and
  request/response paths in Cathryn Lavery's example-architecture.html:
  https://github.com/cathrynlavery/diagram-design/blob/f4547ee95f88e5b28a52517feff6b6c11cc657f9/skills/diagram-design/assets/example-architecture.html
  Changed to a vertical four-node data-flow diagram for 480px README display.
  Source categories stay separate; either host is one shared consumer. Parser
  internals, child-session traversal and model-provider transport are omitted
  here and explained in the README and mechanism guide.

  MIT License
