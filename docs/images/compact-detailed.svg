  Source: examples/validation-history.jsonl, final item_completed record.
  Item: exec-09178280-9355-47f4-a6ce-b1d912cc9dab
  Session: 01a19dea-e6d8-7c73-8542-c3746a473b54
  Views checked against codex_native._compact_item and _detail_projection.
  Excerpts omit cwd, duration, full command paths and other output lines.
  The two panels are alternative views, not sequential execution steps.
