<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 648" role="img" aria-labelledby="views-title views-desc">
  <title id="views-title">Compact and detailed views of the same recorded Codex command</title>
  <desc id="views-desc">A command ran the parser and workbench tests through a pipeline ending in tail -10. Both views retain its command and exit status. Detailed adds the recorded tool output, which reports 124 tests passed and zero failed. Only selected fields and output lines are displayed here; the command's file paths are abbreviated.</desc>
