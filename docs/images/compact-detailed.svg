  <rect width="480" height="648" rx="8" fill="#f6f8fa"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#202c39">
    <text x="240" y="32" text-anchor="middle" font-size="24" font-weight="600">One command, two views</text>
    <text x="240" y="60" text-anchor="middle" font-size="20" fill="#465568">Excerpts from a recorded Codex test run</text>

    <rect x="24" y="80" width="432" height="88" rx="6" fill="#ffffff" stroke="#9aa7b5"/>
    <text x="44" y="112" font-size="20" fill="#465568">Command (file paths shortened here)</text>
    <text x="44" y="145" font-family="ui-monospace, Menlo, monospace" font-size="20">node --test … | tail -10</text>

    <rect x="24" y="192" width="432" height="156" rx="6" fill="#ffffff" stroke="#9aa7b5"/>
    <text x="44" y="226" font-size="24" font-weight="600">Compact</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="20">
      <text x="44" y="264">status: completed</text>
      <text x="44" y="292">exit_code: 0</text>
    </g>
    <text x="44" y="328" font-size="20" fill="#465568">Tool output omitted</text>

    <rect x="24" y="372" width="432" height="252" rx="6" fill="#eaf2fc" stroke="#2563a6" stroke-width="1.5"/>
    <text x="44" y="406" font-size="24" font-weight="600">Detailed</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="20">
      <text x="44" y="444">status: completed</text>
      <text x="44" y="472">exit_code: 0</text>
      <text x="44" y="508" fill="#205a98">aggregated_output:</text>
      <text x="68" y="536">ℹ tests 124</text>
      <text x="68" y="560">ℹ pass 124</text>
      <text x="68" y="584">ℹ fail 0</text>
    </g>
    <text x="44" y="610" font-size="20" fill="#465568">Other output lines omitted from this image</text>
  </g>
</svg>
